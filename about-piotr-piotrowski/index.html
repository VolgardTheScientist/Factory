<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Piotr Piotrowski (The Large P) - The Virtual Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div id="app">
        <!-- Landscape enforcement overlay for mobile -->
        <div id="landscape-prompt" class="hidden">
            <div class="prompt-content">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="4" y="8" width="16" height="8" rx="2" ry="2" transform="rotate(-90 12 12)"></rect>
                    <path d="M16 4h2a2 2 0 0 1 2 2v2"></path>
                    <path d="M20 16v2a2 2 0 0 1-2 2h-2"></path>
                </svg>
                <p>Please rotate your device for the best experience.</p>
            </div>
        </div>

        <!-- Fade transition overlay -->
        <div id="fade-overlay"></div>

        <!-- Main Hall View -->
        <div id="main-hall" class="view active">
            <div class="image-container">
                <img src="../assets/main_hall.jpg" alt="Main Hall" id="main-hall-img" usemap="#hall-map">
                <map name="hall-map" id="hall-map">
                    <!-- Placeholder coordinates, to be updated dynamically or specifically -->
                    <!-- Coordinates format: x1,y1,x2,y2,x3,y3... for polygons -->
                    <area target="" alt="Architecture" title="Architecture" href="#" coords="10,10,100,10,100,100,10,100" shape="poly" data-room="architecture">
                    <area target="" alt="Design" title="Design" href="#" coords="150,10,250,10,250,100,150,100" shape="poly" data-room="design">
                    <area target="" alt="Research" title="Research" href="#" coords="300,10,400,10,400,100,300,100" shape="poly" data-room="research">
                    <area target="" alt="Large P" title="Large P" href="#" coords="450,10,550,10,550,100,450,100" shape="poly" data-room="large-p">
                </map>
            </div>
        </div>

        <!-- Sub Room View -->
        <div id="sub-room" class="view">
            <div class="image-container">
                <img src="" alt="Room" id="sub-room-img">
                
                <button id="back-btn" class="diegetic-btn">
                    <span class="glow-text">&lt; Back to Main Hall</span>
                </button>
                <div id="room-content">
                    <h1 id="room-title">Room</h1>
                </div>

                <!-- Scalable Placeholders (Specifically for Architecture Room currently) -->
                <div id="title-placeholder" class="scalable-element architecture-element hidden">Title Placeholder</div>
                <div id="desc-placeholder" class="scalable-element architecture-element hidden">Description Placeholder</div>
                <div id="portfolio-placeholder" class="scalable-element architecture-element hidden">Portfolio Placeholder</div>
                <div id="back-placeholder" class="scalable-element architecture-element hidden">Back Button Placeholder</div>
                <div id="backward-placeholder" class="scalable-element architecture-element hidden">&lt;</div>
                <div id="forward-placeholder" class="scalable-element architecture-element hidden">&gt;</div>

            </div>
        </div>
    </div>

    <script src="../script.js"></script>
    <script src="../imagemap.js"></script>
    <script src="../elementScaler.js"></script>
</body>
</html>
